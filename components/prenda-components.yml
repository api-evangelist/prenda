summary: >-
  The Prenda Design System (PDS) is the only developer-facing surface Prenda publishes. It is a
  React component and icon library built on MUI, distributed to GitHub Packages under an MIT
  license and open to read on GitHub. IMPORTANT SCOPE NOTE: these are the components Prenda uses to
  build its OWN guide- and parent-facing apps. They are not embeddable widgets a third party
  integrates with a Prenda account, and there is no hosted/prebuilt surface, embedded dashboard, or
  loader script offered to customers. Anyone can install and use PDS, but doing so connects them to
  nothing at Prenda.
