aid: prenda
name: Prenda
description: >-
  Prenda, Inc. is a Mesa, Arizona education technology company that makes it possible for an adult
  to open and run a K-8 microschool — a tight-knit learning community of roughly five to ten
  students — out of a home, studio, or office. Founded by Kelly Smith out of the Prenda Code Club
  he started at a public library in 2013, Prenda opened its first microschool in January 2018 and
  now supports more than 1,000 "guides" running microschools for nearly 10,000 learners across
  multiple US states, funded largely through school-choice and education savings account programs.
  The product is a plug-and-play software platform bundled with curriculum, training, and coaching:
  guides use it to manage enrollment, run adaptive diagnostic assessments in math and reading,
  track learner progress against Prenda's four-mode "connect, conquer, collaborate, create"
  learning day, process payments, and publish a marketing site for their school. Prenda is
  venture-backed, having raised a $20M round led by 776 in 2022. The platform is closed and
  end-user facing — Prenda publishes no public API, developer portal, or machine-readable contract
  of any kind. Its only public developer surface is the Prenda Design System, an open-source MUI
  v6 React component and icon library published from the prenda-school GitHub organization.
